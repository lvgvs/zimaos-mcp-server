# Publish only trusted main pushes that completed all CI jobs successfully.
name: ghcr-publish

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: ghcr-publication
  cancel-in-progress: false

jobs:
  build-and-push:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
      IMAGE: ghcr.io/lvgvs/zimaos-mcp-server
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Reuse the first published commit artifact
        id: existing
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          DIGEST="$(bash scripts/image-policy.sh inspect "$IMAGE:sha-$SOURCE_SHA")"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
      - name: Build a distinct run artifact only if the commit is unpublished
        id: build
        if: steps.existing.outputs.digest == ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/lvgvs/zimaos-mcp-server:run-${{ github.run_id }}-${{ github.run_attempt }}
          labels: |
            org.opencontainers.image.source=https://github.com/lvgvs/zimaos-mcp-server
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
          provenance: mode=min
          sbom: true
      - name: Seal commit artifact and advance development alias by digest
        env:
          EXISTING_DIGEST: ${{ steps.existing.outputs.digest }}
          BUILT_DIGEST: ${{ steps.build.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          DIGEST="${EXISTING_DIGEST:-$BUILT_DIGEST}"
          bash scripts/image-policy.sh promote "$IMAGE" "$DIGEST" "sha-$SOURCE_SHA" immutable
          CURRENT_MAIN="$(gh api repos/lvgvs/zimaos-mcp-server/git/ref/heads/main --jq .object.sha)"
          if [ "$CURRENT_MAIN" = "$SOURCE_SHA" ]; then
            bash scripts/image-policy.sh promote "$IMAGE" "$DIGEST" edge mutable
          fi
          printf 'Source: `%s`\nArtifact: `%s@%s`\n' "$SOURCE_SHA" "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
