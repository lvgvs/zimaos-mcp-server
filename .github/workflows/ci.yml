# Quality gates for every push/PR to main. No disposable-VM credentials are used;
# this workflow must never depend on the integration VM.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality-gates:
    name: lint + typecheck + test + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: npm
      - name: English/Turkish README change parity
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE="$PR_BASE_SHA"
          else
            BASE="$BEFORE_SHA"
          fi
          if [ -z "$BASE" ] || [[ "$BASE" =~ ^0+$ ]] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            BASE="$(git rev-parse HEAD^)"
          fi
          CHANGED="$(git diff --name-only "$BASE" "$GITHUB_SHA" -- README.md README.tr.md)"
          EN_CHANGED="$(printf '%s\n' "$CHANGED" | grep -c '^README\.md$' || true)"
          TR_CHANGED="$(printf '%s\n' "$CHANGED" | grep -c '^README\.tr\.md$' || true)"
          if [ "$EN_CHANGED" -ne "$TR_CHANGED" ]; then
            echo "README.md and README.tr.md must be updated together."
            exit 1
          fi
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Format check (prettier)
        run: npm run format:check
      - name: Lint (eslint)
        run: npm run lint
      - name: Typecheck (tsc, strict)
        run: npm run typecheck
      - name: Test typecheck (tsc, tsconfig.test.json, strict)
        run: npx tsc -p tsconfig.test.json --noEmit
      - name: Unit/integration tests (vitest, mocked)
        run: npm test
      - name: Production build (tsc -> dist/)
        run: npm run build

  docker-image:
    name: production image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Build the production image (no push)
        run: docker build -t zimaos-mcp-server:ci .

  compose-validation:
    name: ZimaOS Compose file is valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Verify Docker Compose availability
        run: docker compose version
      - name: Validate deploy/zimaos/docker-compose.yml
        run: docker compose -f deploy/zimaos/docker-compose.yml config --quiet
